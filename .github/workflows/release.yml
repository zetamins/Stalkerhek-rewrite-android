name: Build and Release

on:
  push:
    branches: [ main, test ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - name: Checkout Rust core
        uses: actions/checkout@v4
        with:
          repository: zetamins/Stalkerhek-rewrite
          ref: test
          path: rust-core

      - name: Install Rust + Android NDK + cargo-ndk
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk
          curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r28b" >> $GITHUB_ENV

      - name: Build Rust library with cargo-ndk
        working-directory: rust-core/rust-core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME}"
          export RUSTFLAGS="--cfg reqwest_unstable"
          cargo ndk --target ${{ matrix.target }} --platform 21 build --release --features android
          mkdir -p output/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/libstalkerhek_engine.so output/${{ matrix.target }}/

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-libs-${{ matrix.target }}
          path: rust-core/rust-core/output/

  build:
    needs: build-rust
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Rust libraries
        uses: actions/download-artifact@v4
        with:
          pattern: rust-libs-*
          path: rust-libs
          merge-multiple: true

      - name: Place native libraries
        run: |
          echo "=== Downloaded files ==="
          find rust-libs -type f | head -20
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          find rust-libs -name "libstalkerhek_engine.so" | while read f; do
            case "$f" in
              *aarch64*) cp "$f" app/src/main/jniLibs/arm64-v8a/ ;;
              *x86_64*)  cp "$f" app/src/main/jniLibs/x86_64/ ;;
              *) echo "WARNING: unknown arch for $f" ;;
            esac
          done
          echo "=== jniLibs contents ==="
          ls -laR app/src/main/jniLibs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APKs (release signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          OUT=app/build/outputs/apk/release
          for apk in "$OUT"/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            case "$base" in
              *arm64-v8a*) cp "$apk" "artifacts/StreamHek-arm64-v8a.apk" ;;
              *x86_64*)    cp "$apk" "artifacts/StreamHek-x86_64.apk" ;;
              *universal*) cp "$apk" "artifacts/StreamHek-universal.apk" ;;
              *)           cp "$apk" "artifacts/StreamHek-universal.apk" ;;
            esac
          done
          ls -lh artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stalkerhek-APKs
          path: artifacts/
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          name: Stalkerhek ${{ github.ref_name }}
          body: |
            ## Stalkerhek Android App ${{ github.ref_name }}

            ### Downloads
            - **arm64-v8a** — For modern Android TV devices and phones
            - **x86_64** — For x86 emulators and devices
            - **Universal** — Contains all architectures

            ### Installation
            Download the APK matching your device and install it.

      - name: Create / Update Beta Pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes 2>/dev/null || true
          gh release create beta artifacts/* \
            --title "StreamHek Beta (Development Build)" \
            --notes "Latest development build from the test branch." \
            --prerelease

